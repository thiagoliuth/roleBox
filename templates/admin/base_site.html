{% extends "admin/base.html" %}
{% load static %}

{% block title %}{{ title }} | PartyBoxd{% endblock %}

{% block extrastyle %}
    {{ block.super }}
    {% include "includes/fonts.html" %}
<script>
    (() => {
        let theme;
        try { theme = localStorage.getItem("partyboxd-theme"); } catch (_) {}
        if (theme !== "light" && theme !== "dark") {
            theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.dataset.theme = theme;
    })();
</script>
<link rel="stylesheet" href="{% static 'home/theme.css' %}" />
<link rel="stylesheet" href="{% static 'home/admin.css' %}" />
<script src="{% static 'home/theme.js' %}" defer></script>
{% endblock %}

{% block branding %}
<div id="site-name">
    <a href="{% url 'admin:index' %}"
        >PartyBoxd <span class="admin-label">Administração</span></a
    >
</div>
{% endblock %}

{% block dark-mode-vars %}{% endblock %}
