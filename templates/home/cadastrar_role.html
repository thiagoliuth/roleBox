<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registar Rolê - PartyBox</title>
    <!-- Importa o Tailwind diretamente para testes rápidos -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#14181c] text-[#9ab] font-sans min-h-screen flex flex-col antialiased">

    <!-- Navbar ao estilo Letterboxd -->
    <header class="flex items-center justify-between px-8 py-4 bg-[#14181c] border-b border-[#2c3440]">
        <div class="flex items-center gap-3">
            <div class="flex gap-1">
                <!-- As famosas bolinhas coloridas -->
                <div class="w-3 h-3 rounded-full bg-[#ff8000]"></div>
                <div class="w-3 h-3 rounded-full bg-[#00e054]"></div>
                <div class="w-3 h-3 rounded-full bg-[#40bcf4]"></div>
            </div>
            <span class="text-white text-2xl font-bold tracking-tight">PartyBox</span>
        </div>
        <nav>
            <a href="/admin/" class="text-sm font-semibold text-[#8c9ca9] hover:text-white transition-colors">ADMIN</a>
        </nav>
    </header>

    <!-- Área Principal com o Formulário -->
    <main class="flex-grow flex items-center justify-center p-6 bg-[url('https://s.ltrbxd.com/static/img/content/home-background.jpg')] bg-cover bg-center">
        <!-- Overlay escuro caso queiras usar uma imagem de fundo real depois -->
        <div class="absolute inset-0 bg-[#14181c] bg-opacity-80 z-0"></div>

        <div class="relative z-10 w-full max-w-md bg-[#1c2228] p-8 rounded-lg shadow-2xl border border-[#2c3440]">
            <h2 class="text-2xl text-white font-semibold text-center mb-6">Registar um novo rolê</h2>

            <form method="post" class="space-y-5">
                {% csrf_token %}

                {% for field in form %}
                <div>
                    <label class="block text-sm font-medium text-[#8c9ca9] uppercase tracking-wider" for="{{ field.id_for_label }}">
                        {{ field.label }}
                    </label>
                    {{ field }}
                    {% if field.errors %}
                        <p class="text-red-500 text-xs mt-1">{{ field.errors.0 }}</p>
                    {% endif %}
                </div>
                {% endfor %}

                <div class="pt-4">
                    <!-- Botão verde clássico do Letterboxd -->
                    <button type="submit" class="w-full bg-[#00b020] hover:bg-[#00e054] text-white font-bold uppercase tracking-widest text-sm py-3 px-4 rounded transition-colors duration-200 shadow-[0_0_10px_rgba(0,224,84,0.3)] hover:shadow-[0_0_15px_rgba(0,224,84,0.6)]">
                        Guardar Rolê
                    </button>
                </div>
            </form>
        </div>
    </main>

</body>
</html>
