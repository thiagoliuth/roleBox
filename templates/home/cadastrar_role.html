{% extends 'base.html' %}

{% block title %}Cadastrar Evento{% endblock %}


{% block content %}


    <!-- Área Principal com o Formulário -->
    <main class="flex-grow flex items-center justify-center p-6 bg-[url('https://s.ltrbxd.com/static/img/content/home-background.jpg')] bg-cover bg-center">
        <!-- Overlay escuro caso queiras usar uma imagem de fundo real depois -->
        <div class="absolute inset-0 bg-[#14181c] bg-opacity-80 z-0"></div>

        <div class="relative z-10 w-full max-w-md bg-[#1c2228] p-8 rounded-lg shadow-2xl border border-[#2c3440]">
            <h2 class="text-2xl text-white font-semibold text-center mb-6">Registar um novo evento</h2>

            <form method="post" class="space-y-5">
                {% csrf_token %}

                {% for field in form %}
                <div>
                    <label class="block text-sm font-medium text-[#8c9ca9] uppercase tracking-wider" for="{{ field.id_for_label }}">
                        {{ field.label }}
                    </label>
                    {{ field }}
                    {% if field.errors %}
                        <p class="text-red-500 text-xs mt-1">{{ field.errors.0 }}</p>
                    {% endif %}
                </div>
                {% endfor %}

                <div class="pt-4">
                    <!-- Botão verde clássico do Letterboxd -->
                    <button type="submit" class="w-full bg-[#00b020] hover:bg-[#00e054] text-white font-bold uppercase tracking-widest text-sm py-3 px-4 rounded transition-colors duration-200 shadow-[0_0_10px_rgba(0,224,84,0.3)] hover:shadow-[0_0_15px_rgba(0,224,84,0.6)]">
                        Guardar Evento
                    </button>
                </div>
            </form>
        </div>
    </main>

</body>
</html>

{% endblock %}
