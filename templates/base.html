<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}RoleBox{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    {% block extra_head %}{% endblock %}
</head>
<body class="{% block body_class %}bg-gradient-to-br from-emerald-900 via-teal-900 to-slate-900 min-h-screen text-slate-100{% endblock %}">


    <header class="w-full mx-auto px-6 py-12 bg-slate-900/40 border-b border-slate-900/10 backdrop-blur">
        {% block header %}
        <nav class="container flex mx-auto items-center justify-between">
            <a href="/" class="flex items-center gap-2 hover:opacity-90 transition">
                <span class="w-3 h-3 rounded-full bg-emerald-400 animate-pulse"></span>
                <span class="font-mono text-sm text-slate-300">RoleBox</span>
            </a>

            <div class="flex items-center gap-6">
                {% block nav_links %}
                <a href="/" class="text-sm text-slate-300 hover:text-white transition">Inicio</a>
                <a href="/sobre/" class="text-sm text-slate-300 hover:text-white transition">Sobre</a>
                <a href="/admin/" class="text-sm text-slate-300 hover:text-white transition">Admin</a>
                {% endblock %}
            </div>
        </nav>
        {% endblock %}
    </header>

    <main class="container mx-auto px-6 py-12">
        {% block content %}{% endblock %}
    </main>

    <footer class="w-full mx-auto px-6 py-4 bg-slate-900/40 border-b border-slate-900/10 backdrop-blur">
        Feito para a aula de Programacao Web · Django 5.1
    </footer>

</body>
</html>
